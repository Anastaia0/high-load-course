global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: case-3-bombardier
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["bombardier:1234"]
  - job_name: case-3-shop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shop:8081"]
